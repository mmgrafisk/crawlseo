name: Build Docker fallback image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build multi-architecture image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image for boot test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: reliva-smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot smoke test
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=reliva -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=reliva \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U reliva >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name smoke-app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://reliva:smoke@smoke-db:5432/reliva \
            -e NEXTAUTH_SECRET=smoke-test-only \
            -e NEXTAUTH_URL=http://localhost:3000 \
            reliva-smoke:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo; echo "boot smoke test: OK"; exit 0
            fi
            sleep 2
          done
          echo "::error::image did not serve /api/health within 60s"
          docker logs smoke-app
          exit 1

      - name: Build and push fallback image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
