name: Reliva Foundation Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: Foundation verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliva_ci
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed dependency lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh dependency lock"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint changed TypeScript files
        run: |
          FILES=$(git diff --name-only --diff-filter=d origin/main...HEAD -- '*.ts' '*.tsx' || true)
          if [ -z "$FILES" ]; then
            echo "No changed TypeScript files"
          else
            echo "$FILES" | xargs npx eslint
          fi

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
