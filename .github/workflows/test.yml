name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliva_ci
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          FILES=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.ts' '*.tsx' || true)
          if [ -z "$FILES" ]; then
            echo "No .ts/.tsx files changed — skipping lint"
          else
            echo "Linting changed files:"
            echo "$FILES"
            echo "$FILES" | xargs npx eslint
          fi

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
